[project]
name = "pf"
version = "0.1.0"
description = "Scaffold markdown content files for james-portfolio from pf.toml templates"
readme = "README.md"
authors = [
    { name = "James Dong", email = "jamesdong00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
]

[project.scripts]
pf = "pf.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
